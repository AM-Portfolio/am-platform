# Slim Contabo graph: Build once; Auto sync preprod on main only; Contabo Approve matrix.
name: AM User Platform Publish

on:
  push:
    branches: ["main", "develop", "fix/**", "hotfix/**", "feature/**", "feat/**"]
    paths:
      - "am-user-platform/**"
      - ".github/workflows/am-user-platform.yml"
      - "libraries/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".dockerignore"
      - "docker/**"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "am-user-platform/**"
      - ".github/workflows/am-user-platform.yml"
      - "libraries/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".dockerignore"
      - "docker/**"
  workflow_dispatch:

jobs:
  publish:
    name: Publish AM User Platform
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish-contabo.yml@main
    with:
      language: "python"
      working_directory: "am-user-platform"
      image_name: "am-user-platform"
      build_context: ".."
    secrets: inherit
