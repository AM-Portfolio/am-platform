# Subscription-only QA on main merge (path-filtered).
# Calls QA Agent ops/start with suite=subscription_module + api_pack=subscription.
# Catalog: am-qa-agents qa-agent/ui_evidence/docs/SUBSCRIPTION_MODULE_CATALOG.md
# Fail closed when secrets missing. No in-GHA Playwright — Temporal owns the suite.

name: Subscription QA on main

on:
  push:
    branches: ["main"]
    paths:
      - "am-subscription/**"
      - ".github/workflows/am-subscription.yml"
      - ".github/workflows/subscription-qa-on-main.yml"
  workflow_dispatch:
    inputs:
      env:
        description: "App env under test (target_url)"
        required: false
        type: choice
        options:
          - dev
          - preprod
          - prod
        default: dev
      target_url:
        description: "App under test (optional override)"
        required: false
        type: string
        default: ""
      gateway_base:
        description: "QA Agent gateway (optional; default org var or prod Temporal)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  subscription-module-qa:
    name: Start subscription_module ops + watch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve endpoints
        id: ep
        shell: bash
        env:
          INPUT_ENV: ${{ github.event.inputs.env }}
          INPUT_TARGET: ${{ github.event.inputs.target_url }}
          INPUT_GATEWAY: ${{ github.event.inputs.gateway_base }}
          VAR_GATEWAY: ${{ vars.QA_AGENT_GATEWAY_BASE }}
        run: |
          set -euo pipefail
          ENV="${INPUT_ENV:-dev}"
          case "${ENV}" in
            prod) DEFAULT_TARGET="https://am.asrax.in" ;;
            preprod) DEFAULT_TARGET="https://am-preprod.asrax.in" ;;
            *) DEFAULT_TARGET="https://am-dev.asrax.in" ;;
          esac
          TARGET="${INPUT_TARGET:-${DEFAULT_TARGET}}"
          TARGET="${TARGET%/}"

          # Contabo Temporal only; dig QA starts workflows on dig task queue there.
          # env=dev → dig gateway (dig workers). Override via input or org var.
          case "${ENV}" in
            prod) DEFAULT_GATEWAY="https://am.asrax.in/qa" ;;
            preprod) DEFAULT_GATEWAY="https://am-preprod.asrax.in/qa" ;;
            *) DEFAULT_GATEWAY="https://am-dev.asrax.in/qa" ;;
          esac
          GATEWAY_BASE="${INPUT_GATEWAY:-${VAR_GATEWAY:-${DEFAULT_GATEWAY}}}"
          GATEWAY_BASE="${GATEWAY_BASE%/}"

          {
            echo "env=${ENV}"
            echo "target_url=${TARGET}"
            echo "gateway_base=${GATEWAY_BASE}"
          } >> "$GITHUB_OUTPUT"
          echo "env=${ENV} target=${TARGET} gateway=${GATEWAY_BASE}"

      - name: Probe QA gateway
        shell: bash
        env:
          GATEWAY_BASE: ${{ steps.ep.outputs.gateway_base }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/qa-ready.json -w "%{http_code}" --connect-timeout 10 --max-time 20 \
            "${GATEWAY_BASE}/ready" || echo 000)
          echo "ready HTTP ${code}"
          head -c 400 /tmp/qa-ready.json || true
          echo
          if [[ "${code}" != "200" ]]; then
            echo "::error::QA gateway not ready at ${GATEWAY_BASE}/ready (HTTP ${code})"
            exit 1
          fi

      - name: Start subscription_module release ops
        id: start
        shell: bash
        env:
          GATEWAY_TOKEN: ${{ secrets.QA_AGENT_GATEWAY_TOKEN }}
          GATEWAY_BASE: ${{ steps.ep.outputs.gateway_base }}
          TARGET_URL: ${{ steps.ep.outputs.target_url }}
          ENV_NAME: ${{ steps.ep.outputs.env }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${GATEWAY_TOKEN}" ]]; then
            echo "::error::QA_AGENT_GATEWAY_TOKEN secret missing (set org Actions secret)"
            exit 1
          fi
          BODY=$(jq -n \
            --arg suite "subscription_module" \
            --arg api_pack "subscription" \
            --arg env "${ENV_NAME}" \
            --arg url "${TARGET_URL}" \
            --arg sha "${SHA}" \
            '{
              release_name: ("subscription-qa-" + $sha[0:12]),
              env: $env,
              suite: $suite,
              api_pack: $api_pack,
              target_url: $url,
              login_mode: "credentials",
              soak_min: 0,
              skip_ui: false,
              skip_cliq: true,
              skip_sheet: false,
              skip_drive: false,
              use_temporal: true,
              requested_by: "github-merge"
            }')
          HTTP_CODE=$(curl -sS -o /tmp/ops-start.json -w "%{http_code}" \
            --connect-timeout 15 --max-time 120 \
            -X POST "${GATEWAY_BASE}/v2/releases/ops/start" \
            -H "Authorization: Bearer ${GATEWAY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${BODY}" || echo 000)
          echo "ops/start HTTP ${HTTP_CODE}"
          cat /tmp/ops-start.json | jq . || cat /tmp/ops-start.json
          if [[ "${HTTP_CODE}" != "200" ]]; then
            echo "::error::ops/start failed HTTP ${HTTP_CODE} gateway=${GATEWAY_BASE}"
            exit 1
          fi
          RESP=$(cat /tmp/ops-start.json)
          RID=$(echo "$RESP" | jq -r '.request_id // empty')
          TID=$(echo "$RESP" | jq -r '.tracking_id // empty')
          WID=$(echo "$RESP" | jq -r '.workflow_id // empty')
          if [[ -z "$RID" || -z "$TID" ]]; then
            echo "::error::ops/start did not return request_id/tracking_id"
            exit 1
          fi
          echo "request_id=${RID}" >> "$GITHUB_OUTPUT"
          echo "tracking_id=${TID}" >> "$GITHUB_OUTPUT"
          echo "workflow_id=${WID}" >> "$GITHUB_OUTPUT"
          {
            echo "## Subscription module QA"
            echo ""
            echo "- suite: \`subscription_module\`"
            echo "- api_pack: \`subscription\`"
            echo "- env: \`${ENV_NAME}\`"
            echo "- gateway: \`${GATEWAY_BASE}\`"
            echo "- target: \`${TARGET_URL}\`"
            echo "- request_id: \`${RID}\`"
            echo "- tracking_id: \`${TID}\`"
            echo "- workflow_id: \`${WID}\`"
            echo "- Specs portal Runs use this tracking_id"
          } > "$GITHUB_STEP_SUMMARY"

      - name: Watch progress
        shell: bash
        env:
          GATEWAY_TOKEN: ${{ secrets.QA_AGENT_GATEWAY_TOKEN }}
          GATEWAY_BASE: ${{ steps.ep.outputs.gateway_base }}
          REQUEST_ID: ${{ steps.start.outputs.request_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 160); do
            RESP=$(curl -sS --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${GATEWAY_TOKEN}" \
              "${GATEWAY_BASE}/v2/releases/${REQUEST_ID}" || echo '{}')
            PHASE=$(echo "$RESP" | jq -r '.phase // "unknown"')
            STATUS=$(echo "$RESP" | jq -r '.progress_status // .status // "unknown"')
            UI_PCT=$(echo "$RESP" | jq -r '.ui_pct // 0')
            UI_DEC=$(echo "$RESP" | jq -r '.ui_decision // empty')
            echo "[$i] phase=${PHASE} status=${STATUS} ui_pct=${UI_PCT} decision=${UI_DEC}"
            {
              echo "## Subscription module QA"
              echo ""
              echo "- request_id: \`${REQUEST_ID}\`"
              echo "- phase: \`${PHASE}\`"
              echo "- status: \`${STATUS}\`"
              echo "- ui_pct: ${UI_PCT}"
              echo "- ui_decision: \`${UI_DEC}\`"
            } > "$GITHUB_STEP_SUMMARY"

            if echo "$RESP" | jq -e '.steps_done | index("release_ops_complete")' >/dev/null 2>&1; then
              if [[ "${STATUS}" == *"fail"* || "${STATUS}" == *"FAIL"* || "${UI_DEC}" == "NO_GO" ]]; then
                echo "::error::Release ops completed with failure status=${STATUS} ui=${UI_DEC}"
                exit 1
              fi
              echo "Complete OK"
              exit 0
            fi
            REQ_STATUS=$(echo "$RESP" | jq -r '.status // empty')
            if [[ "$REQ_STATUS" == "failed" || "$REQ_STATUS" == "rejected" ]]; then
              echo "::error::request status=${REQ_STATUS}"
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for release_ops_complete"
          exit 1
