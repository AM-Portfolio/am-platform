# Slim Contabo graph: Build once; Auto sync preprod on main only; Contabo Approve matrix.
name: AM Identity Publish

on:
  push:
    branches: ["main", "develop", "fix/**", "hotfix/**", "feature/**", "feat/**"]
    paths:
      - "am-identity/**"
      - ".github/workflows/am-identity.yml"
      - "libraries/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".dockerignore"
      - "docker/**"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "am-identity/**"
      - ".github/workflows/am-identity.yml"
      - "libraries/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".dockerignore"
      - "docker/**"
  workflow_dispatch:

jobs:
  publish:
    name: Publish AM Identity
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish-contabo.yml@main
    with:
      language: "python"
      working_directory: "am-identity"
      image_name: "am-identity"
      build_context: ".."
    secrets: inherit
