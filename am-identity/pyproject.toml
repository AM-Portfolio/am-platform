[project]
name = "am-identity"
version = "0.1.0"
description = "Unified Keycloak-backed identity service for AM Platform"
authors = [{ name = "Antigravity Agent", email = "agent@google.com" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.30.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.0.0",
    "PyJWT[crypto]>=2.8.0",
    "am-platform-common",
    "am-platform-security",
    "aiokafka>=0.10.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "python-dotenv>=1.0.0",
    "asyncpg>=0.28.0",
]

[tool.poetry]
name = "am-identity"
version = "0.1.0"
description = "Unified Keycloak-backed identity service for AM Platform"
authors = ["Antigravity Agent <agent@google.com>"]
packages = [
    { include = "am_identity" }
]

[tool.poetry.dependencies]
python = ">=3.10"
fastapi = ">=0.100.0"
uvicorn = ">=0.30.0"
httpx = ">=0.24.0"
pydantic = ">=2.0.0"
email-validator = ">=2.0.0"
pydantic-settings = ">=2.0.0"
PyJWT = {extras = ["crypto"], version = ">=2.8.0"}
am-platform-common = { path = "../libraries/am-platform-common", develop = true }
am-platform-security = { path = "../libraries/am-platform-security", develop = true }
aiokafka = ">=0.10.0"
prometheus-client = ">=0.20.0"
opentelemetry-api = ">=1.24.0"
opentelemetry-sdk = ">=1.24.0"
opentelemetry-exporter-otlp-proto-http = ">=1.24.0"
opentelemetry-instrumentation-fastapi = ">=0.45b0"
python-dotenv = ">=1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
